# Static analysis, secrets, dependencies, containers, SBOM.
#
# Two rules this pipeline follows, because they are what separate a security gate
# people keep from one they disable in week three:
#
#  1. **Fail on severity, report on everything.** Findings go to the Security tab as
#     SARIF regardless; the build only breaks on HIGH/CRITICAL. A scanner that fails
#     a PR over an informational lint gets switched off, and then you have nothing.
#  2. **Least privilege per job.** The workflow default is read-only and each job
#     adds only what it needs. `security-events: write` is what uploads SARIF; no
#     job here needs `contents: write`, so no job gets it.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a dependency that was clean on merge does not stay clean —
    # most vulnerabilities in a repo arrive without anyone touching the repo.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Secrets. First, and blocking — a leaked credential is the one finding where
  # "we'll fix it next sprint" is not an option.
  # ---------------------------------------------------------------------------
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret committed three commits ago and "removed" in the
          # next one is still in the pack, and still valid.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # SAST
  # ---------------------------------------------------------------------------
  semgrep:
    name: sast · semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        # Covers TypeScript and Kotlin in one pass, which is why it is here alongside
        # CodeQL rather than instead of it — CodeQL's Kotlin support is newer and the
        # two disagree usefully.
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/kotlin \
            --config=p/secrets \
            --config=p/dockerfile \
            --sarif --output=semgrep.sarif \
            --metrics=off || true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on high severity
        run: |
          semgrep scan --config=p/default --config=p/typescript --config=p/kotlin \
            --severity=ERROR --error --metrics=off

  codeql:
    name: sast · codeql · ${{ matrix.language }}
    runs-on: ubuntu-latest
    # CodeQL on a project this size is minutes. Anything approaching this ceiling is a
    # hang, not slow analysis, and it should surface as a red X rather than a job that
    # appears to still be working.
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            # Buildless extraction.
            #
            # `manual` needs CodeQL to trace a real Gradle build, and that fought this
            # repo three ways: setup-java gives no Gradle, setup-gradle expects a
            # wrapper this project deliberately does not have, and CodeQL then waits
            # for Gradle's daemon to exit, which it never does. `none` reads the
            # sources directly. Slightly weaker on cross-file dataflow than a traced
            # build, and vastly better than a leg that never reports at all.
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ---------------------------------------------------------------------------
  # Dependencies and containers
  # ---------------------------------------------------------------------------
  dependencies:
    name: deps · vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: MEDIUM,HIGH,CRITICAL
        env:
          # The public DB endpoint rate-limits aggressively; the GHCR mirror does not.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Fail on HIGH or CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  containers:
    name: containers · ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [target-site, worker, control-plane]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build
        run: docker build -t revendo-${{ matrix.service }}:scan ${{ matrix.service }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: revendo-${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: MEDIUM,HIGH,CRITICAL

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # The image scan reports; it does not gate. That split is deliberate.
      #
      # A container image is mostly other people's code: a base OS, its transitive
      # packages, and every dependency-of-a-dependency npm and Gradle resolve. Scanned
      # end to end, a freshly built image essentially always carries some fixable
      # HIGH — a patched libgnutls lands upstream, a transitive `brace-expansion`
      # advisory drops, and a build that was green this morning is red this afternoon
      # with nothing in this repo having changed.
      #
      # Gating on that produces a permanently-red pipeline, and a permanently-red
      # pipeline is one nobody reads. So the policy is:
      #
      #   - **image scan → report.** Everything lands in the Security tab above,
      #     where it can be triaged and where a genuinely alarming CVE is visible.
      #   - **filesystem scan → gate.** The `dependencies` job fails the build on
      #     HIGH/CRITICAL in the manifests this repo actually declares and can bump.
      #
      # Gate what you control, monitor what you inherit. The Dockerfiles still run
      # `apt-get upgrade`, and control-plane pins the Netty and Jackson BOMs, so the
      # inherited surface is kept small rather than merely tolerated.
      - name: Summarise image findings (non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: revendo-${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
          failure-threshold: warning

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [target-site, worker, control-plane]
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t revendo-${{ matrix.service }}:sbom ${{ matrix.service }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: revendo-${{ matrix.service }}:sbom
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.service }}.cyclonedx.json
          output-file: sbom-${{ matrix.service }}.cyclonedx.json

      # An SBOM you generate and discard proves nothing. Retaining it per build is
      # what makes "is this affected?" answerable on the day a CVE lands, without
      # rebuilding an image whose base tag has since moved.
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cyclonedx.json
          retention-days: 90
